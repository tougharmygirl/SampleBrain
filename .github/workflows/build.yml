yaml
name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-liblo

      - name: Patch project file for Windows
        run: |
          sed -i '/^ICON/d; s/ -ldl//' samplebrain.pro
          echo 'LIBS += -lws2_32' >> samplebrain.pro

      - name: Build
        run: |
          mkdir build
          cd build
          qmake CONFIG+=release ../samplebrain.pro
          mingw32-make -j2

      - name: Package
        run: |
          mkdir dist
          cp build/release/samplebrain.exe dist/
          (windeployqt dist/samplebrain.exe || windeployqt-qt5 dist/samplebrain.exe)
          ldd dist/samplebrain.exe | grep -i mingw64 | awk '{print $3}' | xargs -I{} cp -n "{}" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: samplebrain-dark-windows
          path: dist/
